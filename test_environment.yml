name: test

channels:
- conda-forge

dependencies:
- python=3.14
- python-gil  # force standard (non free-threaded) build so pdm.lock cp314 wheels apply
- cxx-compiler
- git
- gdal
- psycopg2=2.9.12
- libpq
# ATCORE dependencies
- django=4.2
- django-select2
- django-taggit<5
- coverage
- factory_boy
- filelock
- geojson
- jinja2
- pandas
- param
- pyshp
- requests
# sqlalchemy<2 has no py3.14 conda-forge build; pdm installs it from PyPI
# tethys_dataset_services requires sqlalchemy<2 in conda; pdm installs both from PyPI
- panel
# TETHYS dependencies
- plotly
- pip:
  - django-datetime-widget2
